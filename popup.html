<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeetCode POTD Status</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="css-i6dzq1"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
      </div>
      <h3>LeetCode POTD</h3>
    </div>
    
    <div class="card">
      <div id="status-display" class="status-checking">
        <span class="spinner"></span>
        <span>Checking status...</span>
      </div>
      <div class="controls">
        <button id="stop-alarm-btn" class="btn btn-secondary" style="display: none;">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" class="btn-icon"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
          Stop Alarm
        </button>
        <button id="test-alarm-btn" class="btn btn-primary">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" class="btn-icon"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          Test Alarm
        </button>
        <button id="reset-status-btn" class="btn btn-secondary" style="margin-top: 4px;">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" class="btn-icon"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
          Reset Status
        </button>
      </div>
    </div>
    <div id="error-message" class="error-message"></div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
